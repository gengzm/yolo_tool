[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-tool"
version = "0.1.0"
description = "YOLO 数据处理与训练工具箱：GUI 工作台 + s0~s5 步骤脚本"
readme = "README.md"
requires-python = ">=3.9"
# 依赖与 requirements.txt 保持一致（版本策略见该文件头部注释）
dependencies = [
    "ultralytics>=8.4.0,<9.0",
    "torch>=2.2.0,<2.5",
    "torchvision>=0.17.0,<0.20",
    "PySide6>=6.6",
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8,<4.11",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "onnx>=1.14",
    "onnxruntime>=1.17,<2.0",
    "onnxslim>=0.1.82",
]

[project.scripts]
yolo-tool = "yolo_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["yolo_tool*"]
